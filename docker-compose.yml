# Weg B auf einem eigenen VPS: der Motor und ein Reverse-Proxy mit automatischem Zertifikat (Caddy).
# Werte kommen aus der Datei .env auf dem Server (nie ins Repository): ADMIN_PASSWORD, DOMAIN,
# optional DATABASE_URL (verwaltetes Postgres), ANTHROPIC_API_KEY, SMTP_URL, MAIL_TO.
# Start: docker compose up -d --build · Logs: docker compose logs -f motor
services:
  motor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - motor-data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in .env setzen, z. B. inhalte.example.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - motor

volumes:
  motor-data:
  caddy-data:
  caddy-config:
